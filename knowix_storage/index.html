<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>html, body { height: 1px; margin: 0; overflow: hidden; padding: 0; }</style>
  </head>
  <body>
    <script>
      const STORAGE_KEY = "knowix.browser-data.v1";
      const systemThemeQuery = window.matchMedia("(prefers-color-scheme: dark)");
      let themePreference = "Sistema";
      const currentSystemTheme = () => systemThemeQuery.matches ? "dark" : "light";
      const effectiveTheme = () => themePreference === "Escuro"
        ? "dark" : themePreference === "Claro" ? "light" : currentSystemTheme();
      const notifyNativeTheme = () => {
        try {
          const topWindow = window.parent && window.parent.parent ? window.parent.parent : window.parent;
          topWindow.postMessage({ type: "knowix-theme", theme: effectiveTheme() }, "*");
        } catch (_) {}
      };
      const streamlit = {
        ready() {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1
          }, "*");
        },
        height() {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            height: 1
          }, "*");
        },
        value(value) {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setComponentValue",
            value,
            dataType: "json"
          }, "*");
        }
      };

      systemThemeQuery.addEventListener("change", () => {
        const systemTheme = currentSystemTheme();
        notifyNativeTheme();
        streamlit.value({ kind: "system-theme", systemTheme });
      });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.data?.type !== "streamlit:render") return;
        const args = event.data.args || {};
        if (args.action === "load") {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            const data = raw === null ? null : JSON.parse(raw);
            themePreference = data?.preferences?.theme || "Sistema";
            const systemTheme = currentSystemTheme();
            notifyNativeTheme();
            streamlit.value({
              kind: "loaded",
              exists: raw !== null,
              data,
              systemTheme
            });
          } catch (_) {
            streamlit.value({ kind: "error", reason: "read" });
          }
        } else if (args.action === "save") {
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(args.data));
            themePreference = args.data?.preferences?.theme || "Sistema";
            notifyNativeTheme();
            streamlit.value({ kind: "saved", revision: args.revision });
          } catch (_) {
            streamlit.value({ kind: "error", reason: "write" });
          }
        }
        streamlit.height();
      });

      streamlit.ready();
    </script>
  </body>
</html>

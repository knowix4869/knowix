<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme:light; }
      :root[data-theme="dark"] { color-scheme:dark; }
      body { color: #14213d; font: 12px Arial, sans-serif; margin: 0; padding: 1px 0 0; }
      .voice-control { margin:0 auto; max-width:150px; text-align:center; width:100%; }
      button {
        align-items: center; background: linear-gradient(135deg,#176eae,#485fea 65%,#7557df);
        border: 1px solid transparent; border-radius: 15px; box-shadow:0 7px 18px #425edb33;
        color: #fff; cursor: pointer; display: flex; font: 650 13px Arial, sans-serif;
        gap: 7px; justify-content: center; min-height: 48px; padding: 0 10px;
        transition:filter .16s ease,transform .16s ease,box-shadow .16s ease;
        touch-action:manipulation; width:100%;
      }
      button:hover { box-shadow:0 9px 22px #425edb44; filter:brightness(1.06); transform:translateY(-1px); }
      button:active { filter:brightness(.98); transform:scale(.98); }
      button:focus-visible { outline:3px solid #246bfe66; outline-offset:3px; }
      button.is-listening { animation:voice-pulse 1.5s ease-in-out infinite; background:linear-gradient(135deg,#b52e55,#db4e67); }
      .mic-icon { flex:none; height:19px; width:19px; }
      .status { color: #69758c; font-size:10px; line-height:1.35; margin:5px 1px 0; text-align:center; }
      @keyframes voice-pulse { 50% { box-shadow:0 0 0 5px #d9446330,0 7px 18px #d9446330; } }
      :root[data-theme="dark"] body {
        color: #eef3ff;
      }
      :root[data-theme="dark"] .status { color:#adbad0; }
      @media (prefers-reduced-motion:reduce) { button { transition:none; } button.is-listening { animation:none; } }
    </style>
  </head>
  <body>
    <div class="voice-control">
      <button id="voice-button" type="button">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="2"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="button-label">Pesquisar por voz</span>
      </button>
      <p class="status" id="voice-status" role="status" aria-live="polite"></p>
    </div>
    <script>
      const button = document.getElementById("voice-button");
      const buttonLabel = document.getElementById("button-label");
      const status = document.getElementById("voice-status");
      const streamlit = {
        ready() { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*"); },
        height() {
          const root = document.querySelector(".voice-control");
          const height = root ? Math.ceil(root.getBoundingClientRect().height + 4) : 56;
          window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height }, "*");
        },
        value(value) { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value, dataType: "json" }, "*"); }
      };
      let labels = {};
      let language = "pt-BR";
      let recognition = null;
      let androidBridge = null;
      let androidListenerAttached = false;
      let listening = false;

      function updateListening(value) {
        listening = value;
        button.classList.toggle("is-listening", value);
        buttonLabel.textContent = value ? (labels.stop || labels.listening) : labels.button;
        streamlit.height();
      }

      function showError(key) {
        status.textContent = labels[key] || labels.error;
        updateListening(false);
      }

      function onAndroidMessage(event) {
        let response;
        try { response = JSON.parse(event.data); } catch (_) { return; }
        if (response.type === "listening") {
          status.textContent = labels.listening;
          updateListening(true);
        } else if (response.type === "result" && response.transcript) {
          status.textContent = labels.recognized;
          updateListening(false);
          streamlit.height();
          streamlit.value({ transcript: response.transcript, id: response.id });
        } else if (response.type === "error") {
          showError(response.error === "permission" ? "permission" : "error");
        } else if (response.type === "stopped") {
          status.textContent = "";
          updateListening(false);
        }
      }

      function startBrowserRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { showError("unsupported"); return; }
        recognition = new SpeechRecognition();
        recognition.lang = language;
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onstart = () => { status.textContent = labels.listening; updateListening(true); };
        recognition.onresult = (event) => {
          const transcript = (event.results?.[0]?.[0]?.transcript || "").trim();
          if (!transcript) return;
          status.textContent = labels.recognized;
          streamlit.height();
          streamlit.value({ transcript, id: `${Date.now()}-${Math.random().toString(36).slice(2)}` });
        };
        recognition.onerror = (event) => {
          showError(event.error === "not-allowed" || event.error === "service-not-allowed" ? "permission" : "error");
        };
        recognition.onend = () => updateListening(false);
        try { recognition.start(); } catch (_) { showError("error"); }
      }

      button.addEventListener("click", () => {
        status.textContent = "";
        if (listening) {
          if (androidBridge) androidBridge.postMessage(JSON.stringify({ type: "cancel" }));
          else if (recognition) recognition.stop();
          updateListening(false);
          return;
        }
        if (androidBridge) {
          updateListening(true);
          androidBridge.postMessage(JSON.stringify({ type: "start", language }));
        } else { startBrowserRecognition(); }
      });

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "streamlit:render") return;
        const args = event.data.args || {};
        labels = args.labels || {};
        document.documentElement.dataset.theme = labels.theme === "dark" ? "dark" : "light";
        language = args.language || "pt-BR";
        buttonLabel.textContent = labels.button || "Search by voice";
        status.textContent = labels.privacy || "";
        androidBridge = window.KnowixAndroidVoice || null;
        if (androidBridge && !androidListenerAttached) {
          androidBridge.addEventListener("message", onAndroidMessage);
          androidListenerAttached = true;
        }
        streamlit.height();
      });

      streamlit.ready();
      streamlit.height();
    </script>
  </body>
</html>

name: Build Knowix apps

on:
  workflow_dispatch:
  push:
    paths:
      - "Knowix-Apps.zip"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract app source
        run: Expand-Archive -Path Knowix-Apps.zip -DestinationPath . -Force
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install -r Knowix-Apps/windows/requirements-build.txt
      - name: Build Knowix.exe
        working-directory: Knowix-Apps/windows
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Knowix knowix_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Knowix-Windows
          path: Knowix-Apps/windows/dist/Knowix.exe
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract app source
        run: unzip -q Knowix-Apps.zip -d .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-provider: basic
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK
        working-directory: Knowix-Apps/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Knowix-Android-debug
          path: Knowix-Apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

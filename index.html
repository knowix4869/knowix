<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14213d">
    <meta name="description" content="Pesquise no Knowix e confira respostas, fontes e vídeos relacionados.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/knowix-192.png" type="image/png">
    <title>Knowix</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { background: #f4f7fc; color: #14213d; font: 14px system-ui, sans-serif; }
      header { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #14213d; color: white; }
      header img { width: 30px; height: 30px; }
      header strong { font-size: 18px; }
      header a { margin-left: auto; color: white; }
      main { height: calc(100% - 52px); }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4f7fc; }
      @media (max-width: 600px) { header { height: 46px; } main { height: calc(100% - 46px); } }
    </style>
  </head>
  <body>
    <header>
      <img src="./icons/knowix-192.png" alt="">
      <strong>Knowix</strong>
      <a href="https://knowix4869-knowix.streamlit.app/" target="_blank" rel="noopener">Abrir no navegador</a>
    </header>
    <main>
      <iframe title="Pesquisa Knowix" src="https://knowix4869-knowix.streamlit.app/?embed=true" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
